<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文音標自動標註器 - 授權存取</title>
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-color: #007AFF;
      --primary-hover: #0056b3;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --border-color: #d2d2d7;
      --success-color: #34c759;
      --purple-color: #5856d6;
      --orange-color: #ff9500;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", "Meiryo", sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 密碼鎖介面 */
    #lock-screen {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    #lock-screen h2 { margin-top: 0; font-size: 1.5rem; }
    #lock-screen p { color: var(--text-secondary); margin-bottom: 20px; }
    
    .password-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
    }

    #unlock-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    /* 主程式介面 - 預設隱藏 */
    #main-content {
      display: none;
      width: 100%;
      max-width: 900px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    header { text-align: center; margin-bottom: 25px; }
    h1 { margin-bottom: 10px; font-weight: 600; font-size: 1.8rem; }

    #status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      background: #eee;
      color: #666;
      margin-bottom: 10px;
    }

    #status.ready { background: #e3f9e5; color: #1db954; }

    textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 17px;
      box-sizing: border-box;
      resize: vertical;
      min-height: 120px;
      outline: none;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

    button.tool-btn {
      flex: 1;
      min-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #copyBtn { background: var(--success-color); display: none; }
    #downloadBtn { background: var(--purple-color); display: none; }
    #translateBtn { background: var(--orange-color); display: none; }

    .output-wrapper {
      margin-top: 30px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #eee;
      min-height: 120px;
      overflow: hidden;
    }

    #output { padding: 30px; font-size: 24px; line-height: 2.5; word-wrap: break-word; }
    #translation-result { padding: 20px 30px; border-top: 1px solid #f0f0f0; background-color: #fafafa; display: none; }

    ruby { ruby-align: space-around; ruby-position: over; margin: 0 1px; }
    rt { font-size: 0.45em; color: var(--primary-color); font-weight: 500; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 20px; }
      button.tool-btn { flex: 100%; }
    }
  </style>
</head>

<body>

  <div id="lock-screen">
    <i data-lucide="lock" style="width: 48px; height: 48px; color: var(--primary-color); margin-bottom: 10px;"></i>
    <h2>需要存取權限</h2>
    <p>請輸入授權密碼以使用此工具</p>
    <input type="password" id="pw-input" class="password-input" placeholder="請輸入密碼">
    <button id="unlock-btn" onclick="verifyPassword()">解鎖工具</button>
  </div>

  <div id="main-content">
    <div class="container">
      <header>
        <h1>日文音標自動標註</h1>
        <div id="status">正在下載日文字典...</div>
      </header>

      <div class="input-group">
        <textarea id="input" rows="4" placeholder="請在此輸入日文..."></textarea>
      </div>

      <div class="actions">
        <button id="convertBtn" class="tool-btn" onclick="convertText()" disabled>
          <i data-lucide="languages"></i> 開始轉換
        </button>
        <button id="copyBtn" class="tool-btn" onclick="copyResult()">
          <i data-lucide="copy"></i> 複製文字
        </button>
        <button id="downloadBtn" class="tool-btn" onclick="downloadImage()">
          <i data-lucide="image"></i> 儲存圖片
        </button>
        <button id="translateBtn" class="tool-btn" onclick="translateText()">
          <i data-lucide="globe"></i> 中文翻譯
        </button>
      </div>

      <div class="output-wrapper">
        <div id="output"></div>
        <div id="translation-result">
          <div style="font-size: 12px; color: #86868b; margin-bottom: 5px; font-weight: bold;">中文翻譯：</div>
          <div id="translation-text"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // 密碼驗證邏輯 (syoulive.com 的 Base64 是 c3lvdWxpdmUuY29t)
    const encodedPass = "c3lvdWxpdmUuY29t";

    function verifyPassword() {
      const input = document.getElementById('pw-input').value;
      if (btoa(input) === encodedPass) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.body.style.alignItems = 'flex-start';
        initApp();
      } else {
        alert("密碼錯誤，請重新輸入。");
      }
    }

    // 按下 Enter 也可以解鎖
    document.getElementById('pw-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifyPassword();
    });

    let kuromojiTokenizer = null;

    function initApp() {
      lucide.createIcons();
      // 載入字典
      kuromoji.builder({ dicPath: "dict/" }).build((err, tokenizer) => {
        if (err) {
          document.getElementById('status').innerText = "❌ 字典載入失敗";
          return;
        }
        kuromojiTokenizer = tokenizer;
        const statusEl = document.getElementById('status');
        statusEl.innerText = "✅ 字典已就緒";
        statusEl.classList.add('ready');
        document.getElementById('convertBtn').disabled = false;
      });
    }

    function convertText() {
      const inputText = document.getElementById('input').value;
      if (!inputText.trim()) return;

      const path = kuromojiTokenizer.tokenize(inputText);
      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = '';
      document.getElementById('translation-result').style.display = 'none';

      path.forEach(token => {
        const surface = token.surface_form;
        if (hasKanji(surface)) {
          const reading = token.reading ? katakanaToHiragana(token.reading) : "";
          const match = surface.match(/^([\u4E00-\u9FAF\u3400-\u4DBF]+)(.*)$/);
          
          if (match && reading) {
            const kanjiPart = match[1];
            const kanaSuffix = match[2];
            const readingPart = reading.substring(0, reading.length - kanaSuffix.length);
            const ruby = document.createElement('ruby');
            ruby.innerHTML = `${kanjiPart}<rt>${readingPart}</rt>`;
            outputDiv.appendChild(ruby);
            if (kanaSuffix) {
              const span = document.createElement('span');
              span.innerText = kanaSuffix;
              outputDiv.appendChild(span);
            }
          } else {
            const ruby = document.createElement('ruby');
            ruby.innerHTML = `${surface}<rt>${reading}</rt>`;
            outputDiv.appendChild(ruby);
          }
        } else {
          const span = document.createElement('span');
          span.innerText = surface;
          outputDiv.appendChild(span);
        }
      });

      document.getElementById('copyBtn').style.display = 'flex';
      document.getElementById('downloadBtn').style.display = 'flex';
      document.getElementById('translateBtn').style.display = 'flex';
      lucide.createIcons();
    }

    async function translateText() {
      const inputText = document.getElementById('input').value;
      if (!inputText.trim()) return;
      const btn = document.getElementById('translateBtn');
      const original = btn.innerHTML;
      try {
        btn.disabled = true; btn.innerHTML = '翻譯中...';
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(inputText)}&langpair=ja|zh-TW`);
        const data = await response.json();
        if (data.responseData) {
          document.getElementById('translation-text').innerText = data.responseData.translatedText;
          document.getElementById('translation-result').style.display = 'block';
          showToast("翻譯完成");
        }
      } catch (err) { showToast("翻譯失敗"); } 
      finally { btn.disabled = false; btn.innerHTML = original; lucide.createIcons(); }
    }

    function downloadImage() {
      const wrapper = document.querySelector('.output-wrapper');
      showToast("正在產生圖片...");
      html2canvas(wrapper, { backgroundColor: "#ffffff", scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'japanese_notes_' + Date.now() + '.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast("圖片已儲存");
      });
    }

    async function copyResult() {
      const output = document.getElementById('output');
      try {
        const blobText = new Blob([output.innerText], { type: 'text/plain' });
        const blobHtml = new Blob([output.innerHTML], { type: 'text/html' });
        await navigator.clipboard.write([new ClipboardItem({ 'text/plain': blobText, 'text/html': blobHtml })]);
        showToast("已帶格式複製");
      } catch (err) {
        await navigator.clipboard.writeText(output.innerText);
        showToast("僅複製純文字");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    function hasKanji(str) { return /[\u4E00-\u9FAF]/.test(str); }
    function katakanaToHiragana(src) {
      return src.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
    }

    // 初始化 Lucide 圖標 (為了鎖定畫面)
    lucide.createIcons();
  </script>
</body>

</html>
