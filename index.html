<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文音標自動標註器 - 專業美化版</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Serif+JP:wght@400;600&display=swap');
  </style>
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-color: #007AFF;
      --primary-hover: #0056b3;
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --border-color: #d2d2d7;
      --success-color: #34c759;
      --purple-color: #af52de;
      --orange-color: #ff9500;
      --danger-color: #ff3b30;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    body {
      font-family: 'Kosugi Maru', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 漢字專用字體 */
    .jp-font-fix {
      font-family: 'Noto Serif JP', "Hiragino Mincho ProN", serif;
    }

    #lock-screen {
      text-align: center;
      background: white;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
      transition: all 0.3s ease;
    }

    .password-input {
      width: 100%;
      padding: 14px;
      margin: 20px 0;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
      transition: border-color 0.2s;
    }

    .password-input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    #unlock-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #unlock-btn:hover { background: var(--primary-hover); }

    #main-content {
      display: none;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    header { text-align: center; margin-bottom: 30px; }
    h1 { margin: 0 0 10px 0; font-weight: 600; font-size: 2rem; letter-spacing: -0.5px; }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      background: #f2f2f7;
      color: #666;
      font-weight: 500;
    }

    #status.ready { background: #e3f9e5; color: #1a8917; }

    .input-group { margin-bottom: 25px; }

    textarea {
      width: 100%;
      padding: 20px;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      font-size: 17px;
      box-sizing: border-box;
      resize: vertical;
      min-height: 140px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }

    textarea:focus {
      border-color: var(--primary-color);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }

    button.tool-btn {
      flex: 1;
      min-width: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.tool-btn:active { transform: scale(0.97); }
    button.tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #convertBtn { background: var(--primary-color); color: white; }
    #convertBtn:hover { background: var(--primary-hover); }
    #copyBtn { background: var(--success-color); color: white; display: none; }
    #downloadBtn { background: var(--purple-color); color: white; display: none; }
    #translateBtn { background: var(--orange-color); color: white; display: none; }

    .output-wrapper {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e5e5e7;
      min-height: 150px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    #output { 
      padding: 35px; 
      font-size: 28px; 
      line-height: 2.8; 
      word-wrap: break-word; 
    }

    #translation-result { 
      padding: 25px 35px; 
      border-top: 1px solid #f0f0f5; 
      background-color: #fbfbfd; 
      display: none; 
    }

    /* 振假名樣式 */
    ruby { 
      ruby-align: space-around; 
      padding: 2px 4px;
      margin: 0 2px; 
      cursor: pointer; 
      transition: all 0.2s;
      border-radius: 6px;
    }
    ruby:hover { background: #eef6ff; box-shadow: 0 2px 8px rgba(0,122,255,0.15); }
    rt { 
      font-size: 0.45em; 
      color: var(--primary-color); 
      font-weight: 600; 
      padding-bottom: 2px;
    }

    /* Modal 彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 380px;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }
    .modal-close {
      position: absolute;
      top: 15px; right: 15px;
      background: #f2f2f7;
      color: #333;
      border: none;
      width: 30px; height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .modal h3 { margin: 0 0 20px 0; font-size: 1.2rem; text-align: center;}
    .modal input {
      width: 100%;
      padding: 12px;
      margin-bottom: 25px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 18px;
      text-align: center;
    }
    .modal-btns { display: flex; gap: 12px; }
    .modal-btns button {
      flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;
    }
    .btn-save { background: var(--primary-color); color: white; }
    .btn-cancel { background: #f2f2f7; color: #333; }

    #translation-text { font-size: 18px; color: #333; cursor: pointer; border-radius: 8px; padding: 5px; transition: 0.2s;}
    #translation-text:hover { background: #f0f0f0; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      z-index: 2000;
    }

    /* RWD 手機優化 */
    @media (max-width: 600px) {
      body { align-items: flex-start; }
      .container { padding: 25px 20px; border-radius: 0; min-height: 100vh; }
      h1 { font-size: 1.5rem; }
      button.tool-btn { flex: 100%; }
      #output { padding: 20px; font-size: 22px; }
      .modal { width: 85%; padding: 20px; }
    }
  </style>
</head>

<body>

  <div id="lock-screen">
    <i data-lucide="shield-check" style="width: 56px; height: 56px; color: var(--primary-color); margin-bottom: 15px;"></i>
    <h2>授權訪問</h2>
    <p style="color: var(--text-secondary); margin-bottom: 10px;">請輸入您的授權密碼以啟動工具</p>
    <input type="password" id="pw-input" class="password-input" placeholder="請輸入密碼...">
    <button id="unlock-btn" onclick="verifyPassword()">立即解鎖</button>
  </div>

  <div id="main-content">
    <div class="container">
      <header>
        <h1 class="jp-font-fix">日文音標自動標註</h1>
        <div id="status"><i data-lucide="loader-2" style="width: 14px; animation: spin 2s linear infinite;"></i> 字典載入中...</div>
      </header>

      <div class="input-group">
        <textarea id="input" rows="4" placeholder="在此貼上或輸入日文文字，例如：春はあけぼの。"></textarea>
      </div>

      <div class="actions">
        <button id="convertBtn" class="tool-btn" onclick="convertText()" disabled>
          <i data-lucide="wand-2"></i> 開始轉換
        </button>
        <button id="copyBtn" class="tool-btn" onclick="copyResult()">
          <i data-lucide="copy"></i> 複製內容
        </button>
        <button id="downloadBtn" class="tool-btn" onclick="downloadImage()">
          <i data-lucide="download"></i> 儲存圖片
        </button>
        <button id="translateBtn" class="tool-btn" onclick="translateText()">
          <i data-lucide="languages"></i> 中文翻譯
        </button>
      </div>

      <div class="output-wrapper">
        <div id="output" class="jp-font-fix"></div>
        <div id="translation-result">
          <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Translation (雙擊編輯)</div>
          <div id="translation-text" ondblclick="enableTranslationEdit()"></div>
          <div id="edit-translation-container">
            <textarea id="edit-translation-input" style="min-height: 80px; font-size: 16px; margin-bottom: 10px;"></textarea>
            <div class="modal-btns">
              <button class="btn-save" onclick="saveTranslation()">確認修改</button>
              <button class="btn-cancel" onclick="cancelTranslationEdit()">取消</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="ruby-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeRubyModal()">✕</button>
      <h3>編輯音標</h3>
      <p id="target-kanji" class="jp-font-fix" style="font-size: 32px; margin-bottom: 15px; text-align: center; color: var(--text-main); font-weight: 600;"></p>
      <input type="text" id="ruby-input" placeholder="請輸入平假名">
      <div class="modal-btns">
        <button class="btn-save" onclick="saveRuby()">更新音標</button>
        <button class="btn-cancel" onclick="closeRubyModal()">取消</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <script>
    const encodedPass = "c3lvdWxpdmUuY29t";
    let kuromojiTokenizer = null;
    let currentEditingRuby = null;

    // 密碼驗證 (完美繼承)
    function verifyPassword() {
      const input = document.getElementById('pw-input').value;
      if (btoa(input) === encodedPass) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.body.style.alignItems = 'center';
        initApp();
      } else {
        alert("密碼錯誤，請重新輸入。");
      }
    }

    document.getElementById('pw-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPassword();
    });

    // 初始化 App
    function initApp() {
      lucide.createIcons();
      kuromoji.builder({ dicPath: "dict/" }).build((err, tokenizer) => {
        if (err) {
          document.getElementById('status').innerHTML = "<i data-lucide='x-circle'></i> 字典載入失敗";
          lucide.createIcons();
          return;
        }
        kuromojiTokenizer = tokenizer;
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = "<i data-lucide='check-circle-2'></i> 字典已就緒";
        statusEl.classList.add('ready');
        document.getElementById('convertBtn').disabled = false;
        lucide.createIcons();
      });
    }

    // 核心轉換邏輯 (完美繼承)
    function convertText() {
      const inputText = document.getElementById('input').value;
      if (!inputText.trim()) return;

      const path = kuromojiTokenizer.tokenize(inputText);
      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = '';
      document.getElementById('translation-result').style.display = 'none';

      path.forEach(token => {
        let surface = token.surface_form;
        let reading = token.reading ? katakanaToHiragana(token.reading) : "";

        if (surface === "令和") { reading = "れいわ"; }

        if (hasKanji(surface)) {
          const match = surface.match(/^([\u4E00-\u9FAF\u3400-\u4DBF]+)(.*)$/);
          if (match && reading) {
            const kanjiPart = match[1];
            const kanaSuffix = match[2];
            const readingPart = reading.endsWith(kanaSuffix) ? 
                               reading.substring(0, reading.length - kanaSuffix.length) : 
                               reading;
            
            const ruby = document.createElement('ruby');
            ruby.innerHTML = `${kanjiPart}<rt>${readingPart}</rt>`;
            ruby.onclick = function() { openRubyModal(this); };
            outputDiv.appendChild(ruby);
            
            if (kanaSuffix) {
              const span = document.createElement('span');
              span.innerText = kanaSuffix;
              outputDiv.appendChild(span);
            }
          } else {
            const ruby = document.createElement('ruby');
            ruby.innerHTML = `${surface}<rt>${reading}</rt>`;
            ruby.onclick = function() { openRubyModal(this); };
            outputDiv.appendChild(ruby);
          }
        } else {
          const span = document.createElement('span');
          span.innerText = surface;
          outputDiv.appendChild(span);
        }
      });

      document.getElementById('copyBtn').style.display = 'flex';
      document.getElementById('downloadBtn').style.display = 'flex';
      document.getElementById('translateBtn').style.display = 'flex';
      lucide.createIcons();
    }

    // 彈窗邏輯
    function openRubyModal(rubyEl) {
      currentEditingRuby = rubyEl;
      const kanji = rubyEl.childNodes[0].textContent;
      const rt = rubyEl.querySelector('rt').innerText;
      document.getElementById('target-kanji').innerText = kanji;
      document.getElementById('ruby-input').value = rt;
      document.getElementById('ruby-modal').style.display = 'flex';
      setTimeout(() => document.getElementById('ruby-input').focus(), 100);
    }

    function closeRubyModal() {
      document.getElementById('ruby-modal').style.display = 'none';
      currentEditingRuby = null;
    }

    function saveRuby() {
      if (currentEditingRuby) {
        const newVal = document.getElementById('ruby-input').value;
        currentEditingRuby.querySelector('rt').innerText = newVal;
        showToast("音標已成功修改");
      }
      closeRubyModal();
    }

    // 翻譯編輯邏輯
    function enableTranslationEdit() {
      const textDiv = document.getElementById('translation-text');
      const container = document.getElementById('edit-translation-container');
      const input = document.getElementById('edit-translation-input');
      
      input.value = textDiv.innerText;
      textDiv.style.display = 'none';
      container.style.display = 'block';
      input.focus();
    }

    function saveTranslation() {
      const textDiv = document.getElementById('translation-text');
      const container = document.getElementById('edit-translation-container');
      const input = document.getElementById('edit-translation-input');
      
      textDiv.innerText = input.value;
      textDiv.style.display = 'block';
      container.style.display = 'none';
      showToast("翻譯內容已更新");
    }

    function cancelTranslationEdit() {
      document.getElementById('translation-text').style.display = 'block';
      document.getElementById('edit-translation-container').style.display = 'none';
    }

    async function translateText() {
      const inputText = document.getElementById('input').value;
      if (!inputText.trim()) return;
      const btn = document.getElementById('translateBtn');
      const original = btn.innerHTML;
      try {
        btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> 翻譯中...';
        lucide.createIcons();
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(inputText)}&langpair=ja|zh-TW`);
        const data = await response.json();
        if (data.responseData) {
          document.getElementById('translation-text').innerText = data.responseData.translatedText;
          document.getElementById('translation-result').style.display = 'block';
          cancelTranslationEdit();
          showToast("翻譯完成");
        }
      } catch (err) { showToast("翻譯失敗，請稍後再試"); } 
      finally { btn.disabled = false; btn.innerHTML = original; lucide.createIcons(); }
    }

    function downloadImage() {
      const wrapper = document.querySelector('.output-wrapper');
      showToast("正在產生高畫質圖片...");
      html2canvas(wrapper, { backgroundColor: "#ffffff", scale: 3, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Japanese_Note_' + new Date().getTime() + '.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast("圖片已成功儲存");
      });
    }

    async function copyResult() {
      const output = document.getElementById('output');
      try {
        const blobText = new Blob([output.innerText], { type: 'text/plain' });
        const blobHtml = new Blob([output.innerHTML], { type: 'text/html' });
        await navigator.clipboard.write([new ClipboardItem({ 'text/plain': blobText, 'text/html': blobHtml })]);
        showToast("已帶格式複製至剪貼簿");
      } catch (err) {
        await navigator.clipboard.writeText(output.innerText);
        showToast("僅複製純文字內容");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      toast.style.bottom = '40px';
      setTimeout(() => { 
        toast.style.opacity = '0'; 
        toast.style.bottom = '30px';
      }, 2500);
    }

    function hasKanji(str) { return /[\u4E00-\u9FAF]/.test(str); }
    function katakanaToHiragana(src) {
      return src.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
    }

    lucide.createIcons();
  </script>
</body>
</html>
